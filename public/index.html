<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillsIncubator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #08080e;
    --surface: rgba(255,255,255,.04);
    --surface-hover: rgba(255,255,255,.08);
    --surface-modal: rgba(18,18,30,.96);
    --border: rgba(255,255,255,.08);
    --border-hover: rgba(255,255,255,.16);
    --text: #f1f1f7;
    --text-2: rgba(255,255,255,.45);
    --text-3: rgba(255,255,255,.25);
    --primary: #7c6af0;
    --primary-light: #a78bfa;
    --primary-glow: rgba(124,106,240,.3);
    --green: #22c55e;
    --yellow: #eab308;
    --orange: #f97316;
    --red: #ef4444;
    --pink: #ec4899;
    --cyan: #06b6d4;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(124,106,240,.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(168,85,247,.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(6,182,212,.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--pink));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    box-shadow: 0 0 30px var(--primary-glow);
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.3px;
    background: linear-gradient(135deg, #f1f1f7 0%, rgba(255,255,255,.6) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header h1 span {
    -webkit-text-fill-color: var(--text-2);
    font-weight: 500;
    font-size: 14px;
    margin-left: 6px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .25s cubic-bezier(.4,0,.2,1);
    white-space: nowrap;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    color: #fff;
    box-shadow: 0 0 20px var(--primary-glow);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 35px var(--primary-glow);
  }
  .btn-primary:active { transform: translateY(0); }

  .btn-ghost {
    background: var(--surface);
    color: var(--text-2);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover {
    background: var(--surface-hover);
    border-color: var(--border-hover);
    color: var(--text);
  }

  .btn-danger {
    background: rgba(239,68,68,.15);
    color: var(--red);
    border: 1px solid rgba(239,68,68,.2);
  }
  .btn-danger:hover {
    background: rgba(239,68,68,.25);
    transform: translateY(-1px);
  }

  .btn-sm {
    padding: 5px 10px;
    font-size: 11px;
    border-radius: 8px;
  }

  .btn-icon {
    width: 32px;
    height: 32px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    text-align: center;
    backdrop-filter: blur(12px);
    transition: .3s;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    opacity: .4;
  }

  .stat-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
  }

  .stat-card .num {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -.5px;
    background: linear-gradient(135deg, var(--text), rgba(255,255,255,.6));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-card .label {
    font-size: 12px;
    color: var(--text-2);
    margin-top: 3px;
    font-weight: 500;
    letter-spacing: .3px;
    text-transform: uppercase;
  }

  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    align-items: center;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    transition: all .25s;
    backdrop-filter: blur(8px);
  }

  .filter-btn:hover {
    border-color: var(--primary);
    color: var(--text);
    background: rgba(124,106,240,.08);
  }

  .filter-btn.active {
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 0 20px var(--primary-glow);
  }

  .filter-divider {
    width: 1px;
    height: 22px;
    background: var(--border);
    margin: 0 6px;
    flex-shrink: 0;
  }

  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 14px;
  }

  .skill-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    cursor: pointer;
    transition: all .35s cubic-bezier(.4,0,.2,1);
    position: relative;
    backdrop-filter: blur(12px);
    overflow: hidden;
  }

  .skill-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(124,106,240,.3), transparent);
    opacity: 0;
    transition: opacity .35s;
  }

  .skill-card:hover {
    border-color: rgba(124,106,240,.3);
    transform: translateY(-3px);
    box-shadow: 0 12px 50px rgba(0,0,0,.4), 0 0 30px rgba(124,106,240,.05);
  }

  .skill-card:hover::before { opacity: 1; }

  .skill-card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }

  .skill-card h3 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -.2px;
    line-height: 1.3;
  }

  .skill-card .desc {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .skill-card .meta {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-2);
  }

  .skill-card .cat-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
  }

  .skill-card .cat-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge-idea { background: rgba(124,106,240,.15); color: var(--primary-light); border: 1px solid rgba(124,106,240,.2); }
  .badge-incubating { background: rgba(249,115,22,.15); color: #fb923c; border: 1px solid rgba(249,115,22,.2); }
  .badge-active { background: rgba(34,197,94,.15); color: #4ade80; border: 1px solid rgba(34,197,94,.2); }
  .badge-refining { background: rgba(234,179,8,.15); color: #facc15; border: 1px solid rgba(234,179,8,.2); }
  .badge-retired { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.2); }
  .badge-terminer { background: rgba(34,197,94,.25); color: #86efac; border: 1px solid rgba(34,197,94,.35); }

  .progress-wrap {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar .fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--pink));
    background-size: 200% 100%;
    animation: shimmer 2s ease-in-out infinite;
    transition: width .8s cubic-bezier(.4,0,.2,1);
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .progress-pct {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-2);
    min-width: 30px;
    text-align: right;
  }

  .skill-card .card-actions {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transform: translateY(-4px);
    transition: all .25s;
  }

  .skill-card:hover .card-actions {
    opacity: 1;
    transform: translateY(0);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(16px);
    align-items: center;
    justify-content: center;
    animation: fadeIn .2s;
  }

  .modal-overlay.open { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal {
    background: var(--surface-modal);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 92%;
    max-width: 640px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 32px;
    animation: scaleIn .3s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 25px 80px rgba(0,0,0,.6);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .modal-header h2 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.3px;
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .2s;
  }

  .modal-close:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border-hover);
  }

  .form-group { margin-bottom: 18px; }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-2);
    letter-spacing: .2px;
    text-transform: uppercase;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,.3);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: all .2s;
    outline: none;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }

  .form-group textarea { resize: vertical; min-height: 70px; }

  .form-row {
    display: flex;
    gap: 14px;
  }

  .form-row > * { flex: 1; }

  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .color-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .color-picker .c {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all .2s;
  }

  .color-picker .c:hover { transform: scale(1.2); }
  .color-picker .c.active { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,.2); }

  .detail-section { margin-bottom: 28px; }

  .detail-section h3 {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .detail-header h2 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -.3px;
  }

  .detail-meta {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-2);
  }

  .detail-meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .detail-desc {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-2);
    margin-bottom: 16px;
  }

  .detail-notes {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-2);
    padding: 14px 16px;
    background: rgba(0,0,0,.2);
    border-radius: 10px;
    margin-bottom: 16px;
    border-left: 3px solid var(--primary);
  }

  .detail-repo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(124,106,240,.1);
    border: 1px solid rgba(124,106,240,.15);
    color: var(--primary-light);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: .2s;
  }

  .detail-repo:hover {
    background: rgba(124,106,240,.2);
  }

  .milestone-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .milestone-item:last-child { border: none; }

  .milestone-item .check {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
    background: transparent;
  }

  .milestone-item .check:hover { border-color: var(--green); }

  .milestone-item .check.done {
    background: var(--green);
    border-color: var(--green);
    box-shadow: 0 0 10px rgba(34,197,94,.3);
  }

  .milestone-item .check.done::after {
    content: '✓';
    color: #000;
    font-size: 12px;
    font-weight: 700;
  }

  .milestone-item .text {
    font-size: 14px;
    flex: 1;
    font-weight: 500;
  }

  .milestone-item .text.done {
    text-decoration: line-through;
    color: var(--text-2);
  }

  .milestone-item .del-milestone {
    background: none;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    font-size: 16px;
    opacity: 0;
    transition: .2s;
  }

  .milestone-item:hover .del-milestone { opacity: 1; }
  .milestone-item .del-milestone:hover { color: var(--red); }

  .milestone-input, .log-input {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .milestone-input input, .log-input input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,.2);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: .2s;
  }

  .milestone-input input:focus, .log-input input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }

  .log-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.6;
  }

  .log-item:last-child { border: none; }
  .log-item .time {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 500;
    margin-bottom: 2px;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
  }

  .empty-state .icon {
    font-size: 56px;
    margin-bottom: 16px;
    opacity: .15;
    display: block;
  }

  .empty-state h3 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
  }

  .empty-state p {
    color: var(--text-2);
    font-size: 14px;
    max-width: 300px;
    margin: 0 auto 20px;
    line-height: 1.6;
  }

  .category-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .category-item:last-child { border: none; }

  .category-item .name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    border-radius: 12px;
    background: var(--surface-modal);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    transform: translateY(80px);
    opacity: 0;
    transition: all .4s cubic-bezier(.4,0,.2,1);
    z-index: 2000;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  .search-input {
    position: relative;
    margin-bottom: 18px;
  }
  .search-input input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,.3);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: .2s;
  }
  .search-input input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }
  .search-input svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-3);
    pointer-events: none;
  }

  .cat-form-card {
    background: rgba(124,106,240,.06);
    border: 1px solid rgba(124,106,240,.15);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    transition: .3s;
  }

  .cat-form-header {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-2);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: .6px;
  }

  .cat-form-footer {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(124,106,240,.1);
  }

  .category-item {
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    transition: all .2s;
    border-radius: 8px;
    margin: 0 -8px;
    padding: 10px 12px;
  }
  .category-item:last-child { border: none; }
  .category-item:hover {
    background: var(--surface);
  }

  .category-item .name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
  }

  .cat-count {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 500;
    background: var(--surface);
    padding: 2px 10px;
    border-radius: 12px;
    white-space: nowrap;
  }

  .cat-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity .2s;
  }
  .category-item:hover .cat-actions { opacity: 1; }

  .chat-section {
    border-top: 1px solid var(--border);
    padding-top: 20px;
    margin-top: 20px;
  }
  .chat-messages {
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.6;
    animation: fadeIn .2s;
  }
  .chat-bubble.user {
    align-self: flex-end;
    background: var(--primary);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .chat-bubble.assistant {
    align-self: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .chat-bubble.error {
    align-self: flex-start;
    background: rgba(239,68,68,.15);
    border: 1px solid rgba(239,68,68,.2);
    color: var(--red);
  }
  .chat-input {
    display: flex;
    gap: 8px;
  }
  .chat-input input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,.2);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .chat-input input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }
  .chat-typing {
    align-self: flex-start;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chat-typing .dots { display: flex; gap: 3px; }
  .chat-typing .dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-3);
    animation: dotPulse 1.4s infinite ease-in-out;
  }
  .chat-typing .dots span:nth-child(2) { animation-delay: .2s; }
  .chat-typing .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotPulse {
    0%, 80%, 100% { opacity: .3; transform: scale(.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  @media (max-width: 640px) {
    .app { padding: 16px 12px; }
    .skills-grid { grid-template-columns: 1fr; }
    .form-row { flex-direction: column; }
    .header { flex-direction: column; align-items: stretch; gap: 14px; }
    .header-left { justify-content: center; }
    .header-actions { justify-content: center; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .modal { padding: 20px; width: 96%; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <div class="logo">✦</div>
      <h1>SkillsIncubator <span>— incuber & maîtriser</span></h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="openCatModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Catégories
      </button>
      <button class="btn btn-ghost" onclick="openAISettings()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        IA
      </button>
      <button class="btn btn-primary" onclick="openSkillModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nouveau Skill
      </button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <div id="skillsContainer"></div>
</div>

<div class="modal-overlay" id="skillModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="skillModalTitle">Nouveau Skill</h2>
      <button class="modal-close" onclick="closeModal('skillModal')">✕</button>
    </div>
    <input type="hidden" id="skillId">
    <div class="form-group">
      <label>Nom</label>
      <input id="skillName" placeholder="ex: React, Docker, TypeScript...">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="skillDesc" placeholder="Ce que ce skill apporte..."></textarea>
    </div>
    <div class="form-group" id="statusGroup" style="display:none">
      <label>Statut</label>
      <select id="skillStatus">
        <option value="incubating">Incubating</option>
        <option value="active">Active</option>
        <option value="refining">Refining</option>
        <option value="terminer">Terminé</option>
        <option value="retired">Retired</option>
      </select>
    </div>
    <div class="form-group" id="statusInfo" style="background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:#fb923c;margin-bottom:18px">
      <strong>✦ Statut :</strong> Nouveau skill automatiquement en <strong>incubation</strong>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Progression</label>
        <input type="number" id="skillProgress" min="0" max="100" value="0" placeholder="0-100">
      </div>
    </div>
    <div class="form-group">
      <label>Catégorie</label>
      <select id="skillCategory"></select>
    </div>
    <div class="form-group">
      <label>Dépôt</label>
      <input id="skillRepo" placeholder="https://github.com/...">
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="skillNotes" placeholder="Notes personnelles..."></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('skillModal')">Annuler</button>
      <button class="btn btn-primary" onclick="saveSkill()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="catModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Gestion des Catégories</h2>
      <button class="modal-close" onclick="closeModal('catModal')">✕</button>
    </div>

    <div class="search-input">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="catSearch" placeholder="Rechercher une catégorie..." oninput="renderCatList()">
    </div>

    <div class="cat-form-card" id="catFormCard">
      <div class="cat-form-header" id="catFormHeader">Nouvelle catégorie</div>
      <input type="hidden" id="editCatId" value="">
      <div class="form-row">
        <div class="form-group" style="flex:2;margin-bottom:0">
          <label>Nom</label>
          <input id="catName" placeholder="ex: Frontend, Backend, DevOps...">
        </div>
        <div class="form-group" style="flex:1;margin-bottom:0">
          <label>Couleur</label>
          <div class="color-picker" id="catColors"></div>
        </div>
      </div>
      <div class="cat-form-footer">
        <button class="btn btn-ghost btn-sm" id="cancelEditBtn" style="display:none" onclick="cancelCatEdit()">Annuler</button>
        <button class="btn btn-primary btn-sm" onclick="saveCategory()">Ajouter</button>
      </div>
    </div>

    <div id="catList"></div>

    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('catModal')">Fermer</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailModalTitle">Détail</h2>
      <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<div class="modal-overlay" id="aiSettingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configuration IA
      </h2>
      <button class="modal-close" onclick="closeModal('aiSettingsModal')">✕</button>
    </div>

    <div class="form-group">
      <label>Fournisseur IA</label>
      <select id="aiProvider">
        <option value="ollama">Ollama (local)</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
      </select>
    </div>

    <div class="form-group">
      <label>Modèle</label>
      <input id="aiModel" placeholder="llama3, gpt-4o-mini, claude-3-haiku...">
    </div>

    <div class="form-group" id="aiEndpointGroup">
      <label>Endpoint API</label>
      <input id="aiEndpoint" placeholder="http://localhost:11434">
    </div>

    <div class="form-group" id="aiKeyGroup" style="display:none">
      <label>Clé API</label>
      <input id="aiApiKey" type="password" placeholder="sk-...">
    </div>

    <div id="aiConfigStatus" style="font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:10px;display:none"></div>

    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('aiSettingsModal')">Fermer</button>
      <button class="btn btn-ghost" id="aiTestBtn" onclick="testAIConnection()">Tester la connexion</button>
      <button class="btn btn-primary" onclick="saveAIConfig()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
let skills = [];
let categories = [];
let filterStatus = '';
let filterCategory = '';
let editingCatId = null;
const COLORS = ['#6366f1','#8b5cf6','#ec4899','#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#3b82f6'];

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json', ...opts.headers },
      ...opts,
    });
  } catch (err) {
    toast('Erreur réseau: ' + err.message);
    throw err;
  }
  if (!res.ok) { const e = await res.json(); toast(e.error || 'Erreur'); throw new Error(e.error); }
  return res.json();
}

async function init() {
  await loadCategories();
  await loadSkills();
  renderAll();
}

async function loadCategories() {
  categories = await api('/categories');
}

async function loadSkills() {
  const params = new URLSearchParams();
  if (filterStatus) params.set('status', filterStatus);
  if (filterCategory) params.set('category_id', filterCategory);
  skills = await api('/skills?' + params.toString());
}

function renderAll() {
  renderStats();
  renderFilters();
  renderSkills();
}

function renderStats() {
  const total = skills.length;
  const byStatus = {};
  skills.forEach(s => { byStatus[s.status] = (byStatus[s.status] || 0) + 1; });
  const avg = total ? Math.round(skills.reduce((a,s) => a + s.progress, 0) / total) : 0;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">Total Skills</div></div>
    <div class="stat-card"><div class="num">${byStatus['incubating'] || 0}</div><div class="label">En incubation</div></div>
    <div class="stat-card"><div class="num">${byStatus['active'] || 0}</div><div class="label">Actifs</div></div>
    <div class="stat-card"><div class="num">${byStatus['terminer'] || 0}</div><div class="label">Terminés</div></div>
    <div class="stat-card"><div class="num">${avg}%</div><div class="label">Prog. moyenne</div></div>
  `;
}

function renderFilters() {
  const statuses = ['','idea','incubating','active','refining','terminer','retired'];
  const labels = ['Tous','Idea','Incubating','Active','Refining','Terminé','Retired'];
  let html = '';
  statuses.forEach((s, i) => {
    html += `<button class="filter-btn ${filterStatus === s ? 'active' : ''}" onclick="setFilterStatus('${s}')">${labels[i]}</button>`;
  });
  if (categories.length) {
    html += `<span class="filter-divider"></span>`;
    html += `<button class="filter-btn ${!filterCategory ? 'active' : ''}" onclick="setFilterCategory('')">Toutes</button>`;
    categories.forEach(c => {
      html += `<button class="filter-btn ${filterCategory == c.id ? 'active' : ''}" onclick="setFilterCategory(${c.id})">${esc(c.name)}</button>`;
    });
  }
  document.getElementById('filters').innerHTML = html;
}

function renderSkills() {
  const container = document.getElementById('skillsContainer');
  if (!skills.length) {
    container.innerHTML = `
      <div class="empty-state">
        <span class="icon">✦</span>
        <h3>Commence ton incubation</h3>
        <p>Ajoute ton premier skill pour démarrer le suivi de progression.</p>
        <button class="btn btn-primary" onclick="openSkillModal()">+ Nouveau Skill</button>
      </div>`;
    return;
  }
  let html = '<div class="skills-grid">';
  skills.forEach(s => {
    const cat = categories.find(c => c.id === s.category_id);
    html += `
      <div class="skill-card" onclick="openDetail(${s.id})">
        <div class="card-actions">
          <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();openSkillModal(${s.id})">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          </button>
          <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteSkill(${s.id})">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
        <div class="top-row">
          <h3>${esc(s.name)}</h3>
          <span class="badge badge-${s.status}">${s.status === 'terminer' ? 'Terminé' : s.status.charAt(0).toUpperCase() + s.status.slice(1)}</span>
        </div>
        ${s.description ? `<div class="desc">${esc(s.description)}</div>` : ''}
        <div class="meta">
          ${cat ? `<span class="cat-tag"><span class="cat-dot" style="background:${cat.color}"></span>${esc(cat.name)}</span>` : ''}
          <span>${s.progress}%</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="fill" style="width:${s.progress}%"></div></div>
          <span class="progress-pct">${s.progress}%</span>
        </div>
      </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

let aiConfig = {};

async function openAISettings() {
  try {
    aiConfig = await api('/ai/config');
  } catch {
    aiConfig = { provider: 'ollama', model: 'llama3', endpoint: 'http://localhost:11434', openaiKey: '', anthropicKey: '' };
  }
  document.getElementById('aiProvider').value = aiConfig.provider || 'ollama';
  document.getElementById('aiModel').value = aiConfig.model || '';
  document.getElementById('aiEndpoint').value = aiConfig.endpoint || '';
  const keyField = document.getElementById('aiApiKey');
  const keyGroup = document.getElementById('aiKeyGroup');
  if (aiConfig.provider === 'openai') {
    keyField.value = aiConfig.openaiKey || '';
    keyField.placeholder = 'sk-...';
    keyGroup.style.display = '';
  } else if (aiConfig.provider === 'anthropic') {
    keyField.value = aiConfig.anthropicKey || '';
    keyField.placeholder = 'sk-ant-...';
    keyGroup.style.display = '';
  } else {
    keyGroup.style.display = 'none';
  }
  document.getElementById('aiEndpointGroup').style.display = aiConfig.provider === 'ollama' ? '' : 'none';
  document.getElementById('aiConfigStatus').style.display = 'none';
  openModal('aiSettingsModal');
}

document.getElementById('aiProvider')?.addEventListener('change', function() {
  const keyGroup = document.getElementById('aiKeyGroup');
  const endpointGroup = document.getElementById('aiEndpointGroup');
  const keyField = document.getElementById('aiApiKey');
  if (this.value === 'openai') {
    keyField.placeholder = 'sk-...';
    keyGroup.style.display = '';
    endpointGroup.style.display = 'none';
  } else if (this.value === 'anthropic') {
    keyField.placeholder = 'sk-ant-...';
    keyGroup.style.display = '';
    endpointGroup.style.display = 'none';
  } else {
    keyGroup.style.display = 'none';
    endpointGroup.style.display = '';
  }
  document.getElementById('aiConfigStatus').style.display = 'none';
});

async function saveAIConfig() {
  const config = {
    provider: document.getElementById('aiProvider').value,
    model: document.getElementById('aiModel').value.trim(),
    endpoint: document.getElementById('aiEndpoint').value.trim(),
    openaiKey: document.getElementById('aiApiKey').value,
    anthropicKey: document.getElementById('aiApiKey').value,
  };
  try {
    const res = await api('/ai/config', { method: 'PUT', body: JSON.stringify(config) });
    aiConfig = res;
    toast('Configuration IA enregistrée ✓');
    closeModal('aiSettingsModal');
  } catch (err) {
    toast('Erreur: ' + err.message);
  }
}

async function testAIConnection() {
  const btn = document.getElementById('aiTestBtn');
  btn.textContent = 'Test en cours...';
  btn.disabled = true;
  const status = document.getElementById('aiConfigStatus');
  status.style.display = '';
  status.style.background = 'rgba(124,106,240,.1)';
  status.style.border = '1px solid rgba(124,106,240,.2)';
  status.style.color = 'var(--primary-light)';
  status.textContent = 'Connexion en cours...';

  const config = {
    provider: document.getElementById('aiProvider').value,
    model: document.getElementById('aiModel').value.trim() || 'llama3',
    endpoint: document.getElementById('aiEndpoint').value.trim(),
    openaiKey: document.getElementById('aiApiKey').value,
    anthropicKey: document.getElementById('aiApiKey').value,
  };

  try {
    const res = await fetch(API + '/ai/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur');
    status.style.background = 'rgba(34,197,94,.1)';
    status.style.border = '1px solid rgba(34,197,94,.2)';
    status.style.color = '#4ade80';
    status.textContent = '✓ Connexion réussie : ' + data.content;
  } catch (err) {
    status.style.background = 'rgba(239,68,68,.1)';
    status.style.border = '1px solid rgba(239,68,68,.2)';
    status.style.color = '#f87171';
    status.textContent = '✗ Échec : ' + (err.message || 'Impossible de contacter le service IA');
  }

  btn.textContent = 'Tester la connexion';
  btn.disabled = false;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function setFilterStatus(s) {
  filterStatus = s;
  refresh();
}

function setFilterCategory(id) {
  filterCategory = id;
  refresh();
}

async function refresh() {
  await loadSkills();
  renderAll();
}

async function openSkillModal(id) {
  document.getElementById('skillModalTitle').textContent = id ? 'Modifier le Skill' : 'Nouveau Skill';
  document.getElementById('skillId').value = id || '';
  document.getElementById('skillName').value = '';
  document.getElementById('skillDesc').value = '';
  document.getElementById('skillStatus').value = 'incubating';
  document.getElementById('skillProgress').value = 0;
  document.getElementById('skillRepo').value = '';
  document.getElementById('skillNotes').value = '';

  const sel = document.getElementById('skillCategory');
  sel.innerHTML = '<option value="">— Aucune —</option>';
  categories.forEach(c => {
    sel.innerHTML += `<option value="${c.id}">${esc(c.name)}</option>`;
  });

  if (id) {
    document.getElementById('statusGroup').style.display = '';
    document.getElementById('statusInfo').style.display = 'none';
    const s = await api('/skills/' + id);
    document.getElementById('skillName').value = s.name || '';
    document.getElementById('skillDesc').value = s.description || '';
    document.getElementById('skillStatus').value = s.status || 'incubating';
    document.getElementById('skillProgress').value = s.progress || 0;
    document.getElementById('skillCategory').value = s.category_id || '';
    document.getElementById('skillRepo').value = s.repo_url || '';
    document.getElementById('skillNotes').value = s.notes || '';
  } else {
    document.getElementById('statusGroup').style.display = 'none';
    document.getElementById('statusInfo').style.display = '';
  }

  openModal('skillModal');
}

async function saveSkill() {
  const id = document.getElementById('skillId').value;
  const data = {
    name: document.getElementById('skillName').value.trim(),
    description: document.getElementById('skillDesc').value.trim(),
    status: document.getElementById('skillStatus').value,
    progress: parseInt(document.getElementById('skillProgress').value) || 0,
    category_id: document.getElementById('skillCategory').value || null,
    repo_url: document.getElementById('skillRepo').value.trim(),
    notes: document.getElementById('skillNotes').value.trim(),
  };
  if (!data.name) return toast('Le nom est requis.');
  try {
    if (id) {
      await api('/skills/' + id, { method: 'PUT', body: JSON.stringify(data) });
      toast('Skill mis à jour ✓');
    } else {
      await api('/skills', { method: 'POST', body: JSON.stringify(data) });
      toast('Skill créé ✓');
    }
    closeModal('skillModal');
    await refresh();
  } catch (err) {
    console.error('Erreur saveSkill:', err);
  }
}

async function deleteSkill(id) {
  if (!confirm('Supprimer ce skill définitivement ?')) return;
  await api('/skills/' + id, { method: 'DELETE' });
  toast('Skill supprimé');
  await refresh();
}

function openCatModal() {
  editingCatId = null;
  document.getElementById('editCatId').value = '';
  document.getElementById('catName').value = '';
  document.getElementById('catSearch').value = '';
  document.getElementById('cancelEditBtn').style.display = 'none';
  document.getElementById('catFormHeader').textContent = 'Nouvelle catégorie';
  document.querySelector('#catModal .btn-primary').textContent = 'Ajouter';
  initColorPicker();
  renderCatList();
  openModal('catModal');
}

function initColorPicker() {
  const cp = document.getElementById('catColors');
  cp.innerHTML = '';
  COLORS.forEach(c => {
    cp.innerHTML += `<div class="c" style="background:${c}" data-color="${c}" onclick="document.querySelectorAll('#catColors .c').forEach(x=>x.classList.remove('active'));this.classList.add('active')"></div>`;
  });
  cp.firstChild?.classList.add('active');
}

async function saveCategory() {
  const name = document.getElementById('catName').value.trim();
  if (!name) return toast('Nom requis');
  const active = document.querySelector('#catColors .c.active');
  const color = active ? active.dataset.color : '#6366f1';
  const editId = document.getElementById('editCatId').value;

  if (editId) {
    await api('/categories/' + editId, { method: 'PUT', body: JSON.stringify({ name, color }) });
    toast('Catégorie modifiée ✓');
  } else {
    await api('/categories', { method: 'POST', body: JSON.stringify({ name, color }) });
    toast('Catégorie ajoutée ✓');
  }

  document.getElementById('catName').value = '';
  document.getElementById('editCatId').value = '';
  document.getElementById('cancelEditBtn').style.display = 'none';
  document.getElementById('catFormHeader').textContent = 'Nouvelle catégorie';
  document.querySelector('#catModal .btn-primary').textContent = 'Ajouter';
  editingCatId = null;
  await loadCategories();
  renderCatList();
  renderFilters();
}

async function deleteCategory(id) {
  if (!confirm('Supprimer cette catégorie ? Les skills associés ne seront plus catégorisés.')) return;
  await api('/categories/' + id, { method: 'DELETE' });
  toast('Catégorie supprimée');
  await loadCategories();
  renderCatList();
  renderFilters();
  await refresh();
}

function renderCatList() {
  const search = (document.getElementById('catSearch').value || '').toLowerCase();
  const filtered = search ? categories.filter(c => c.name.toLowerCase().includes(search)) : categories;
  const el = document.getElementById('catList');
  if (!filtered.length) {
    el.innerHTML = '<p style="color:var(--text-2);font-size:14px;text-align:center;padding:20px">' + (search ? 'Aucune catégorie trouvée.' : 'Aucune catégorie.') + '</p>';
    return;
  }
  el.innerHTML = filtered.map(c => {
    const count = c.skill_count || 0;
    return `
      <div class="category-item">
        <span class="cat-dot" style="width:12px;height:12px;background:${c.color};border-radius:50%;flex-shrink:0;box-shadow:0 0 8px ${c.color}40"></span>
        <span class="name">${esc(c.name)}</span>
        <span class="cat-count">${count} skill${count > 1 ? 's' : ''}</span>
        <div class="cat-actions">
          <button class="btn btn-sm btn-ghost" onclick="editCategory(${c.id})" title="Modifier">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          </button>
          <button class="btn btn-sm btn-danger" onclick="deleteCategory(${c.id})" title="Supprimer">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

function editCategory(id) {
  const cat = categories.find(c => c.id === id);
  if (!cat) return;
  editingCatId = id;
  document.getElementById('editCatId').value = id;
  document.getElementById('catName').value = cat.name;
  document.getElementById('catFormHeader').textContent = 'Modifier la catégorie';
  document.getElementById('cancelEditBtn').style.display = '';
  document.querySelector('#catModal .btn-primary').textContent = 'Enregistrer';
  const swatches = document.querySelectorAll('#catColors .c');
  swatches.forEach(el => {
    el.classList.remove('active');
    if (el.dataset.color === cat.color) el.classList.add('active');
  });
  document.getElementById('catName').focus();
  document.getElementById('catFormCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cancelCatEdit() {
  editingCatId = null;
  document.getElementById('editCatId').value = '';
  document.getElementById('catName').value = '';
  document.getElementById('catFormHeader').textContent = 'Nouvelle catégorie';
  document.getElementById('cancelEditBtn').style.display = 'none';
  document.querySelector('#catModal .btn-primary').textContent = 'Ajouter';
  initColorPicker();
}

async function openDetail(id) {
  chatMessages = [];
  const s = await api('/skills/' + id);
  const cat = categories.find(c => c.id === s.category_id);
  const el = document.getElementById('detailContent');

  const catHtml = cat ? `<span class="detail-meta-item"><span class="cat-dot" style="width:8px;height:8px;background:${cat.color};border-radius:50%"></span> ${esc(cat.name)}</span>` : '';

  el.innerHTML = `
    <div class="detail-header">
      <h2>${esc(s.name)}</h2>
      <span class="badge badge-${s.status}">${s.status === 'terminer' ? 'Terminé' : s.status.charAt(0).toUpperCase() + s.status.slice(1)}</span>
    </div>

    <div class="detail-meta">
      ${catHtml}
      <span class="detail-meta-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Progression: ${s.progress}%
      </span>
      ${s.repo_url ? `<a href="${esc(s.repo_url)}" target="_blank" class="detail-repo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        Voir le dépôt
      </a>` : ''}
    </div>

    ${s.description ? `<p class="detail-desc">${esc(s.description)}</p>` : ''}
    ${s.notes ? `<div class="detail-notes">${esc(s.notes)}</div>` : ''}

    <div class="detail-section">
      <h3>Jalons</h3>
      <div id="milestoneList">
        ${(s.milestones || []).map(m => `
          <div class="milestone-item">
            <div class="check ${m.done ? 'done' : ''}" onclick="toggleMilestone(${m.id})"></div>
            <span class="text ${m.done ? 'done' : ''}">${esc(m.title)}</span>
            <button class="del-milestone" onclick="deleteMilestone(${m.id})">✕</button>
          </div>
        `).join('')}
      </div>
      <div class="milestone-input">
        <input id="milestoneInput" placeholder="Nouveau jalon..." onkeydown="if(event.key==='Enter')addMilestone(${id})">
        <button class="btn btn-primary btn-sm" onclick="addMilestone(${id})">Ajouter</button>
      </div>
    </div>

    <div class="detail-section">
      <h3>Journal</h3>
      <div id="logList">
        ${(s.logs || []).map(l => `
          <div class="log-item">
            <div class="time">${l.created_at}</div>
            <div>${esc(l.message)}</div>
          </div>
        `).join('')}
      </div>
      <div class="log-input">
        <input id="logInput" placeholder="Ajouter une note..." onkeydown="if(event.key==='Enter')addLog(${id})">
        <button class="btn btn-primary btn-sm" onclick="addLog(${id})">Ajouter</button>
      </div>
    </div>

    ${s.status === 'incubating' ? `
    <div class="detail-section" style="border:1px solid rgba(34,197,94,.2);border-radius:14px;padding:18px;background:rgba(34,197,94,.04)">
      <h3 style="color:#4ade80;border:none;padding:0;margin-bottom:12px;display:flex;align-items:center;gap:6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Terminer l'incubation
      </h3>
      <div style="display:flex;gap:10px;align-items:center">
        <input id="exportDir" placeholder="Dossier de sauvegarde (ex: C:\\Users\\...\\skills)" style="flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);font-size:13px;font-family:inherit;outline:none">
        <button class="btn btn-primary" onclick="exportSkill(${s.id})">Valider & Exporter</button>
      </div>
    </div>` : ''}

    <div class="chat-section" id="chatSection">
      <h3 style="font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Assistant IA
      </h3>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="Pose une question sur ce skill..." onkeydown="if(event.key==='Enter')sendChatMessage(${id})">
        <button class="btn btn-primary btn-sm" onclick="sendChatMessage(${id})">Envoyer</button>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('detailModal')">Fermer</button>
      <button class="btn btn-primary" onclick="closeModal('detailModal');openSkillModal(${id})">Modifier</button>
    </div>
  `;
  openModal('detailModal');
  if (s.status === 'incubating') setTimeout(() => autoInitChat(id), 600);
}

async function addMilestone(skillId) {
  const input = document.getElementById('milestoneInput');
  const title = input.value.trim();
  if (!title) return;
  await api(`/skills/${skillId}/milestones`, { method: 'POST', body: JSON.stringify({ title }) });
  input.value = '';
  toast('Jalon ajouté ✓');
  openDetail(skillId);
}

async function toggleMilestone(id) {
  await api(`/milestones/${id}/toggle`, { method: 'PUT' });
  const detail = document.querySelector('#detailModal.open');
  if (detail) {
    const skillName = document.querySelector('#detailContent h2')?.textContent;
    if (skillName) {
      const s = skills.find(sk => sk.name === skillName);
      if (s) openDetail(s.id);
    }
  }
}

async function deleteMilestone(id) {
  await api(`/milestones/${id}`, { method: 'DELETE' });
  toast('Jalon supprimé');
  const skillName = document.querySelector('#detailContent h2')?.textContent;
  if (skillName) {
    const s = skills.find(sk => sk.name === skillName);
    if (s) openDetail(s.id);
  }
}

async function exportSkill(skillId) {
  const dir = document.getElementById('exportDir').value.trim();
  if (!dir) return toast('Veuillez entrer un dossier de sauvegarde.');
  try {
    const res = await api(`/skills/${skillId}/export`, { method: 'POST', body: JSON.stringify({ directory: dir }) });
    toast(`Skill exporté ✓ → ${res.path}`);
    closeModal('detailModal');
    await refresh();
  } catch (e) {
    toast('Erreur d\'export: ' + e.message);
  }
}

async function addLog(skillId) {
  const input = document.getElementById('logInput');
  const message = input.value.trim();
  if (!message) return;
  await api(`/skills/${skillId}/logs`, { method: 'POST', body: JSON.stringify({ message }) });
  input.value = '';
  toast('Note ajoutée ✓');
  openDetail(skillId);
}

let chatMessages = [];

async function sendChatMessage(skillId) {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  chatMessages.push({ role: 'user', content: text });
  input.value = '';
  renderChat();

  const chatContainer = document.getElementById('chatMessages');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'chat-typing';
  typingDiv.id = 'chatTyping';
  typingDiv.innerHTML = 'Assistant réfléchit<span class="dots"><span></span><span></span><span></span></span>';
  chatContainer.appendChild(typingDiv);
  chatContainer.scrollTop = chatContainer.scrollHeight;

  try {
    const res = await api(`/skills/${skillId}/chat`, {
      method: 'POST',
      body: JSON.stringify({ messages: chatMessages }),
    });
    chatMessages.push({ role: 'assistant', content: res.content });
  } catch (err) {
    chatMessages.push({ role: 'assistant', content: 'Désolé, l\'assistant est momentanément indisponible. Vérifie que le service IA est bien lancé.' });
  }

  renderChat();
}

function renderChat() {
  const container = document.getElementById('chatMessages');
  if (!container) return;
  container.innerHTML = chatMessages.map(m => `
    <div class="chat-bubble ${m.role}">${esc(m.content)}</div>
  `).join('');
  container.scrollTop = container.scrollHeight;
}

async function autoInitChat(skillId) {
  const container = document.getElementById('chatMessages');
  if (!container) return;
  chatMessages = [{ role: 'user', content: 'Présente-toi et donne-moi un premier conseil pour bien démarrer l\'incubation de ce skill.' }];
  const typingDiv = document.createElement('div');
  typingDiv.className = 'chat-typing';
  typingDiv.id = 'chatTyping';
  typingDiv.innerHTML = 'Assistant réfléchit<span class="dots"><span></span><span></span><span></span></span>';
  container.appendChild(typingDiv);
  container.scrollTop = container.scrollHeight;
  try {
    const res = await api(`/skills/${skillId}/chat`, { method: 'POST', body: JSON.stringify({ messages: chatMessages }) });
    chatMessages.push({ role: 'assistant', content: res.content });
  } catch {
    chatMessages.push({ role: 'assistant', content: 'Assistant IA disponible après configuration dans le menu Paramètres → IA.' });
  }
  renderChat();
}

function openModal(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) {
      m.classList.remove('open');
      document.body.style.overflow = '';
    }
  });
});

init();
</script>
</body>
</html>
