<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incubateur de Skills | Compétences </title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222e;
    --border: #2a2a3a;
    --text: #e4e4ec;
    --text2: #9090a8;
    --primary: #6366f1;
    --primary-glow: rgba(99,102,241,0.25);
    --green: #22c55e;
    --yellow: #eab308;
    --orange: #f97316;
    --red: #ef4444;
    --radius: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .app { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 32px; padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 24px; font-weight: 700;
    background: linear-gradient(135deg, var(--primary), #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header h1 small {
    font-size: 14px; font-weight: 400;
    -webkit-text-fill-color: var(--text2);
    background: none; margin-left: 8px;
  }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .5px;
  }
  .badge-idea { background: #6366f120; color: #818cf8; }
  .badge-incubating { background: #f9731620; color: #fb923c; }
  .badge-active { background: #22c55e20; color: #4ade80; }
  .badge-refining { background: #eab30820; color: #facc15; }
  .badge-retired { background: #ef444420; color: #f87171; }

  /* Filters */
  .filters {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px;
  }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text2); cursor: pointer;
    font-size: 13px; transition: .2s;
  }
  .filter-btn:hover { border-color: var(--primary); color: var(--text); }
  .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* Stats */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; text-align: center;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* Button */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: .2s; white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #4f46e5; box-shadow: 0 0 20px var(--primary-glow); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--text); color: var(--text); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-green { background: var(--green); color: #000; }
  .btn-green:hover { background: #16a34a; }

  /* Grid */
  .skills-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .skill-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    cursor: pointer; transition: .25s; position: relative;
  }
  .skill-card:hover {
    border-color: var(--primary); transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
  }
  .skill-card .top {
    display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;
  }
  .skill-card h3 { font-size: 16px; font-weight: 600; }
  .skill-card .desc {
    font-size: 13px; color: var(--text2); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 10px;
  }
  .skill-card .meta {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    font-size: 12px; color: var(--text2);
  }
  .skill-card .cat-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  }
  .progress-bar {
    height: 4px; background: var(--border); border-radius: 4px;
    margin-top: 12px; overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--primary), #a78bfa);
    transition: width .5s;
  }
  .skill-card .card-actions {
    position: absolute; top: 12px; right: 12px; display: none; gap: 4px;
  }
  .skill-card:hover .card-actions { display: flex; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 14px; width: 90%; max-width: 620px;
    max-height: 90vh; overflow-y: auto; padding: 28px;
  }
  .modal h2 { font-size: 20px; margin-bottom: 20px; }
  .modal .close {
    float: right; background: none; border: none; color: var(--text2);
    font-size: 24px; cursor: pointer;
  }
  .modal .close:hover { color: var(--text); }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600;
    margin-bottom: 5px; color: var(--text2);
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 14px; font-family: inherit;
    transition: .2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .form-row { display: flex; gap: 12px; }
  .form-row > * { flex: 1; }

  .form-actions {
    display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px;
  }

  /* Detail panel */
  .detail-section { margin-bottom: 24px; }
  .detail-section h3 {
    font-size: 14px; font-weight: 600; color: var(--text2);
    text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .detail-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  .detail-header h2 { margin-bottom: 0; font-size: 22px; }

  .milestone-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .milestone-item:last-child { border: none; }
  .milestone-item .check {
    width: 18px; height: 18px; border-radius: 4px;
    border: 2px solid var(--border); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: .2s; background: transparent;
  }
  .milestone-item .check.done {
    background: var(--green); border-color: var(--green);
  }
  .milestone-item .check.done::after { content: '✓'; color: #000; font-size: 12px; font-weight: 700; }
  .milestone-item .text { font-size: 14px; flex: 1; }
  .milestone-item .text.done { text-decoration: line-through; color: var(--text2); }
  .milestone-item .del-milestone {
    background: none; border: none; color: var(--text2); cursor: pointer;
    font-size: 16px; opacity: 0; transition: .2s;
  }
  .milestone-item:hover .del-milestone { opacity: 1; }
  .milestone-input {
    display: flex; gap: 6px; margin-top: 8px;
  }
  .milestone-input input {
    flex: 1; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 13px;
  }
  .milestone-input input:focus { outline: none; border-color: var(--primary); }

  .log-item {
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 13px; line-height: 1.5;
  }
  .log-item:last-child { border: none; }
  .log-item .time { font-size: 11px; color: var(--text2); }
  .log-input {
    display: flex; gap: 6px; margin-top: 8px;
  }
  .log-input input {
    flex: 1; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 13px;
  }
  .log-input input:focus { outline: none; border-color: var(--primary); }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text2);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .3; }
  .empty-state h3 { font-size: 18px; margin-bottom: 6px; color: var(--text); }

  .color-picker {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .color-picker .c {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; transition: .15s;
  }
  .color-picker .c:hover { transform: scale(1.15); }
  .color-picker .c.active { border-color: #fff; }

  .category-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 4px; font-size: 11px;
  }

  @media (max-width: 600px) {
    .app { padding: 16px 12px; }
    .skills-grid { grid-template-columns: 1fr; }
    .form-row { flex-direction: column; }
    .header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .header-actions { width: 100%; }
    .header-actions .btn { flex: 1; justify-content: center; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <h1>Incubateur <small>de Skills | Compétences</small></h1>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="openCatModal()">Catégories</button>
      <button class="btn btn-primary" onclick="openSkillModal()">+ Nouveau Skill</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="filters" id="filters"></div>

  <div id="skillsContainer"></div>
</div>

<!-- Skill Modal -->
<div class="modal-overlay" id="skillModal">
  <div class="modal">
    <button class="close" onclick="closeModal('skillModal')">&times;</button>
    <h2 id="skillModalTitle">Nouveau Skill</h2>
    <input type="hidden" id="skillId">
    <div class="form-group">
      <label>Nom du skill</label>
      <input id="skillName" placeholder="ex: React, Docker, TypeScript...">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="skillDesc" placeholder="Ce que ce skill apporte..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Statut</label>
        <select id="skillStatus">
          <option value="idea">Idea</option>
          <option value="incubating">Incubating</option>
          <option value="active">Active</option>
          <option value="refining">Refining</option>
          <option value="retired">Retired</option>
        </select>
      </div>
      <div class="form-group">
        <label>Progression (0-100)</label>
        <input type="number" id="skillProgress" min="0" max="100" value="0">
      </div>
    </div>
    <div class="form-group">
      <label>Catégorie</label>
      <select id="skillCategory"></select>
    </div>
    <div class="form-group">
      <label>URL du dépôt</label>
      <input id="skillRepo" placeholder="https://github.com/...">
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="skillNotes" placeholder="Notes personnelles..."></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('skillModal')">Annuler</button>
      <button class="btn btn-primary" onclick="saveSkill()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Category Modal -->
<div class="modal-overlay" id="catModal">
  <div class="modal">
    <button class="close" onclick="closeModal('catModal')">&times;</button>
    <h2>Gérer les Catégories</h2>
    <div class="form-group">
      <label>Nouvelle catégorie</label>
      <input id="catName" placeholder="ex: Frontend, Backend, DevOps..." style="margin-bottom:8px">
      <label style="margin-bottom:4px">Couleur</label>
      <div class="color-picker" id="catColors"></div>
    </div>
    <button class="btn btn-primary" onclick="addCategory()" style="margin-bottom:20px">Ajouter</button>
    <div id="catList"></div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('catModal')">Fermer</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <button class="close" onclick="closeModal('detailModal')">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
const API = '/api';

// State
let skills = [];
let categories = [];
let filterStatus = '';
let filterCategory = '';

const COLORS = ['#6366f1','#8b5cf6','#ec4899','#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#3b82f6'];

// ---- Fetch helpers ----
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.error || 'Erreur'); }
  return res.json();
}

// ---- Init ----
async function init() {
  await loadCategories();
  await loadSkills();
  renderAll();
}

async function loadCategories() {
  categories = await api('/categories');
}

async function loadSkills() {
  const params = new URLSearchParams();
  if (filterStatus) params.set('status', filterStatus);
  if (filterCategory) params.set('category_id', filterCategory);
  skills = await api('/skills?' + params.toString());
}

// ---- Render ----
function renderAll() {
  renderStats();
  renderFilters();
  renderSkills();
}

function renderStats() {
  const total = skills.length;
  const byStatus = {};
  skills.forEach(s => { byStatus[s.status] = (byStatus[s.status] || 0) + 1; });
  const avg = total ? Math.round(skills.reduce((a,s) => a + s.progress, 0) / total) : 0;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">Total Skills</div></div>
    <div class="stat-card"><div class="num">${byStatus['incubating'] || 0}</div><div class="label">En incubation</div></div>
    <div class="stat-card"><div class="num">${byStatus['active'] || 0}</div><div class="label">Actifs</div></div>
    <div class="stat-card"><div class="num">${avg}%</div><div class="label">Prog. moyenne</div></div>
  `;
}

function renderFilters() {
  const statuses = ['','idea','incubating','active','refining','retired'];
  const labels = ['Tous','Idea','Incubating','Active','Refining','Retired'];
  let html = '';
  statuses.forEach((s, i) => {
    html += `<button class="filter-btn ${filterStatus === s ? 'active' : ''}" onclick="setFilterStatus('${s}')">${labels[i]}</button>`;
  });
  if (categories.length) {
    html += `<span style="width:1px;height:24px;background:var(--border);margin:0 4px;display:inline-block;vertical-align:middle"></span>`;
    html += `<button class="filter-btn ${!filterCategory ? 'active' : ''}" onclick="setFilterCategory('')">Toutes cat.</button>`;
    categories.forEach(c => {
      html += `<button class="filter-btn ${filterCategory == c.id ? 'active' : ''}" onclick="setFilterCategory(${c.id})" style="border-left:3px solid ${c.color}}">${c.name}</button>`;
    });
  }
  document.getElementById('filters').innerHTML = html;
}

function renderSkills() {
  const container = document.getElementById('skillsContainer');
  if (!skills.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">&#9889;</div>
        <h3>Aucun skill pour le moment</h3>
        <p style="color:var(--text2);font-size:14px">Clique sur "Nouveau Skill" pour commencer à incuber.</p>
      </div>`;
    return;
  }
  let html = '<div class="skills-grid">';
  skills.forEach(s => {
    const cat = categories.find(c => c.id === s.category_id);
    html += `
      <div class="skill-card" onclick="openDetail(${s.id})">
        <div class="card-actions">
          <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();openSkillModal(${s.id})">✎</button>
          <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteSkill(${s.id})">✕</button>
        </div>
        <div class="top">
          <h3>${esc(s.name)}</h3>
          <span class="badge badge-${s.status}">${s.status}</span>
        </div>
        ${s.description ? `<div class="desc">${esc(s.description)}</div>` : ''}
        <div class="meta">
          ${cat ? `<span><span class="cat-dot" style="background:${cat.color}"></span> ${esc(cat.name)}</span>` : ''}
          <span>${s.progress}%</span>
          ${s.milestones_count !== undefined ? `<span>${s.milestones_count} jalons</span>` : ''}
        </div>
        <div class="progress-bar"><div class="fill" style="width:${s.progress}%"></div></div>
      </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ---- Filter ----
function setFilterStatus(s) {
  filterStatus = s;
  refresh();
}

function setFilterCategory(id) {
  filterCategory = id;
  refresh();
}

async function refresh() {
  await loadSkills();
  renderAll();
}

// ---- Skill CRUD ----
async function openSkillModal(id) {
  document.getElementById('skillModalTitle').textContent = id ? 'Modifier le Skill' : 'Nouveau Skill';
  document.getElementById('skillId').value = id || '';
  document.getElementById('skillName').value = '';
  document.getElementById('skillDesc').value = '';
  document.getElementById('skillStatus').value = 'idea';
  document.getElementById('skillProgress').value = 0;
  document.getElementById('skillRepo').value = '';
  document.getElementById('skillNotes').value = '';

  const sel = document.getElementById('skillCategory');
  sel.innerHTML = '<option value="">— Aucune —</option>';
  categories.forEach(c => {
    sel.innerHTML += `<option value="${c.id}" style="color:${c.color}">${esc(c.name)}</option>`;
  });

  if (id) {
    const s = await api('/skills/' + id);
    document.getElementById('skillName').value = s.name || '';
    document.getElementById('skillDesc').value = s.description || '';
    document.getElementById('skillStatus').value = s.status || 'idea';
    document.getElementById('skillProgress').value = s.progress || 0;
    document.getElementById('skillCategory').value = s.category_id || '';
    document.getElementById('skillRepo').value = s.repo_url || '';
    document.getElementById('skillNotes').value = s.notes || '';
  }

  openModal('skillModal');
}

async function saveSkill() {
  const id = document.getElementById('skillId').value;
  const data = {
    name: document.getElementById('skillName').value.trim(),
    description: document.getElementById('skillDesc').value.trim(),
    status: document.getElementById('skillStatus').value,
    progress: parseInt(document.getElementById('skillProgress').value) || 0,
    category_id: document.getElementById('skillCategory').value || null,
    repo_url: document.getElementById('skillRepo').value.trim(),
    notes: document.getElementById('skillNotes').value.trim(),
  };
  if (!data.name) return alert('Le nom est requis.');
  if (id) {
    await api('/skills/' + id, { method: 'PUT', body: JSON.stringify(data) });
  } else {
    await api('/skills', { method: 'POST', body: JSON.stringify(data) });
  }
  closeModal('skillModal');
  await refresh();
}

async function deleteSkill(id) {
  if (!confirm('Supprimer ce skill définitivement ?')) return;
  await api('/skills/' + id, { method: 'DELETE' });
  await refresh();
}

// ---- Category ----
function openCatModal() {
  document.getElementById('catName').value = '';
  const cp = document.getElementById('catColors');
  cp.innerHTML = '';
  COLORS.forEach(c => {
    cp.innerHTML += `<div class="c" style="background:${c}" data-color="${c}" onclick="document.querySelectorAll('#catColors .c').forEach(x=>x.classList.remove('active'));this.classList.add('active')"></div>`;
  });
  cp.firstChild?.classList.add('active');
  renderCatList();
  openModal('catModal');
}

async function addCategory() {
  const name = document.getElementById('catName').value.trim();
  if (!name) return alert('Nom requis');
  const active = document.querySelector('#catColors .c.active');
  const color = active ? active.dataset.color : '#6366f1';
  await api('/categories', { method: 'POST', body: JSON.stringify({ name, color }) });
  document.getElementById('catName').value = '';
  await loadCategories();
  renderCatList();
  renderFilters();
}

async function deleteCategory(id) {
  if (!confirm('Supprimer cette catégorie ? Les skills associés ne seront plus catégorisés.')) return;
  await api('/categories/' + id, { method: 'DELETE' });
  await loadCategories();
  renderCatList();
  renderFilters();
  await refresh();
}

function renderCatList() {
  const el = document.getElementById('catList');
  if (!categories.length) { el.innerHTML = '<p style="color:var(--text2)">Aucune catégorie.</p>'; return; }
  el.innerHTML = categories.map(c => `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span class="cat-dot" style="width:10px;height:10px;background:${c.color}"></span>
      <span style="flex:1">${esc(c.name)}</span>
      <button class="btn btn-sm btn-danger" onclick="deleteCategory(${c.id})">✕</button>
    </div>
  `).join('');
}

// ---- Detail ----
async function openDetail(id) {
  const s = await api('/skills/' + id);
  const cat = categories.find(c => c.id === s.category_id);
  const el = document.getElementById('detailContent');
  el.innerHTML = `
    <div class="detail-header">
      <h2>${esc(s.name)}</h2>
      <span class="badge badge-${s.status}">${s.status}</span>
    </div>

    <div class="detail-section">
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:14px;color:var(--text2)">
        ${cat ? `<span><span class="cat-dot" style="width:8px;height:8px;background:${cat.color};display:inline-block;border-radius:50%"></span> ${esc(cat.name)}</span>` : ''}
        <span>Progression: <strong>${s.progress}%</strong></span>
        ${s.repo_url ? `<span>Repo: <a href="${esc(s.repo_url)}" target="_blank" style="color:var(--primary)">${esc(s.repo_url)}</a></span>` : ''}
      </div>
      ${s.description ? `<p style="font-size:14px;line-height:1.6;color:var(--text2);margin-bottom:16px">${esc(s.description)}</p>` : ''}
      ${s.notes ? `<p style="font-size:13px;line-height:1.5;color:var(--text2);padding:10px;background:var(--surface);border-radius:6px;margin-bottom:16px"><em>${esc(s.notes)}</em></p>` : ''}
    </div>

    <div class="detail-section">
      <h3>Jalons</h3>
      <div id="milestoneList">
        ${(s.milestones || []).map(m => `
          <div class="milestone-item">
            <div class="check ${m.done ? 'done' : ''}" onclick="toggleMilestone(${m.id})"></div>
            <span class="text ${m.done ? 'done' : ''}">${esc(m.title)}</span>
            <button class="del-milestone" onclick="deleteMilestone(${m.id})">✕</button>
          </div>
        `).join('')}
      </div>
      <div class="milestone-input">
        <input id="milestoneInput" placeholder="Nouveau jalon..." onkeydown="if(event.key==='Enter')addMilestone(${id})">
        <button class="btn btn-sm btn-primary" onclick="addMilestone(${id})">+</button>
      </div>
    </div>

    <div class="detail-section">
      <h3>Journal d'incubation</h3>
      <div id="logList">
        ${(s.logs || []).map(l => `
          <div class="log-item">
            <div class="time">${l.created_at}</div>
            <div>${esc(l.message)}</div>
          </div>
        `).join('')}
      </div>
      <div class="log-input">
        <input id="logInput" placeholder="Ajouter une note..." onkeydown="if(event.key==='Enter')addLog(${id})">
        <button class="btn btn-sm btn-primary" onclick="addLog(${id})">+</button>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('detailModal')">Fermer</button>
      <button class="btn btn-primary" onclick="closeModal('detailModal');openSkillModal(${id})">Modifier</button>
    </div>
  `;
  openModal('detailModal');
}

async function addMilestone(skillId) {
  const input = document.getElementById('milestoneInput');
  const title = input.value.trim();
  if (!title) return;
  await api(`/skills/${skillId}/milestones`, { method: 'POST', body: JSON.stringify({ title }) });
  input.value = '';
  openDetail(skillId);
}

async function toggleMilestone(id) {
  await api(`/milestones/${id}/toggle`, { method: 'PUT' });
  const detail = document.querySelector('#detailModal.open');
  if (detail) {
    const idInput = document.querySelector('#detailContent [data-skill-id]');
  }
  document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
  const s = await api('/skills/' + document.querySelector('#detailContent h2').textContent);
}

async function deleteMilestone(id) {
  await api(`/milestones/${id}`, { method: 'DELETE' });
  const skillId = document.querySelector('#detailContent .milestone-input button').getAttribute('onclick').match(/\d+/)[0];
  openDetail(parseInt(skillId));
}

async function addLog(skillId) {
  const input = document.getElementById('logInput');
  const message = input.value.trim();
  if (!message) return;
  await api(`/skills/${skillId}/logs`, { method: 'POST', body: JSON.stringify({ message }) });
  input.value = '';
  openDetail(skillId);
}

// ---- Modal helpers ----
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// ---- Start ----
init();
</script>
</body>
</html>
